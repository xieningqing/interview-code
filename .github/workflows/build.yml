name: Build interview-code

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        shell: bash
        run: |
          node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - name: Build Windows
        run: npm run dist:win

      - name: Prepare Windows artifact
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "windows-artifact"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $portableExecutables = @(Get-ChildItem release -File -Filter "*-portable.exe")
          if ($portableExecutables.Count -ne 1) {
            throw "Expected exactly one portable executable, found $($portableExecutables.Count)"
          }

          $envExample = Join-Path $env:GITHUB_WORKSPACE "release\.env.example"
          if (-not (Test-Path $envExample -PathType Leaf)) {
            throw "Missing release/.env.example"
          }

          Copy-Item $portableExecutables[0].FullName (Join-Path $artifactDir $portableExecutables[0].Name)
          Copy-Item $envExample (Join-Path $artifactDir ".env.example")

          $artifactFiles = @(Get-ChildItem $artifactDir -File)
          if ($artifactFiles.Count -ne 2) {
            throw "Expected exactly two files in the Windows artifact, found $($artifactFiles.Count)"
          }
          $artifactFiles | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interview-code-v${{ steps.package.outputs.version }}-win-x64
          path: |
            windows-artifact/*.exe
            windows-artifact/.env.example
          include-hidden-files: true
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        shell: bash
        run: |
          node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - name: Build macOS
        run: npm run dist:mac

      - name: Prepare macOS artifact
        shell: bash
        run: |
          artifact_dir="$GITHUB_WORKSPACE/macos-artifact"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"

          mac_zip="$(find release -maxdepth 1 -type f -name '*-mac-x64.zip' -print -quit)"
          if [ -z "$mac_zip" ]; then
            echo "Missing macOS zip in release"
            exit 1
          fi

          ditto -x -k --sequesterRsrc "$mac_zip" "$artifact_dir"
          app_path="$(find "$artifact_dir" -type d -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "The macOS zip does not contain an .app bundle"
            exit 1
          fi

          app_parent="$(dirname "$app_path")"
          if [ "$app_parent" != "$artifact_dir" ]; then
            mv "$app_path" "$artifact_dir/"
          fi

          app_count="$(find "$artifact_dir" -maxdepth 1 -type d -name '*.app' | wc -l | tr -d ' ')"
          if [ "$app_count" -ne 1 ]; then
            echo "Expected exactly one .app bundle, found $app_count"
            exit 1
          fi

          find "$artifact_dir" -mindepth 1 -maxdepth 1 ! -name '*.app' -exec rm -rf {} +

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interview-code-v${{ steps.package.outputs.version }}-mac-x64
          path: macos-artifact/*.app
          include-hidden-files: true
          if-no-files-found: error
