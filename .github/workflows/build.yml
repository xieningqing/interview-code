name: Build interview-code

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        shell: bash
        run: |
          node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - name: Build Windows
        run: npm run dist:win -- --x64

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interview-code-v${{ steps.package.outputs.version }}-win-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: package
        shell: bash
        run: |
          node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - name: Build macOS
        run: npm run dist:mac -- --x64

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interview-code-v${{ steps.package.outputs.version }}-mac-x64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
